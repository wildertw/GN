<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write-ups | Greenville Natives Fantasy Football League</title>
<meta name="description" content="Weekly write-ups from the Greenville Natives fantasy football league.">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --primary: #005A2B;
  --secondary: #0B6836;
  --accent: #EDEDEE;
  --persimmon: #989EA5;
  --bg: #001A0D;
  --card: #002E17;
  --text: #ffffff;
  --text-muted: #EDEDEE;
  --border: #0B6836;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
h1,h2,h3,h4,h5,h6 {
  font-family: 'Oswald', sans-serif;
  text-transform: uppercase;
  letter-spacing: 1px;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.navbar {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border-bottom: 3px solid var(--accent);
}
.nav-links li a {
  color: var(--text);
  display: block;
  padding: 1rem 1rem;
  font-weight: 500;
  font-size: 0.86rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 3px solid transparent;
  transition: all 0.25s;
}
.nav-links li a:hover,
.nav-links li a.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: rgba(237,237,238,0.1);
  text-decoration: none;
}
.hamburger { display: none; }
.nav-links.open {
  display: flex !important;
  flex-direction: column;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--primary);
  border-top: 1px solid var(--border);
}

.issue-card {
  display: block;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 0.75rem;
  padding: 1.5rem;
  transition: all 0.25s;
}
.issue-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  text-decoration: none;
}
.issue-meta {
  font-family: 'Oswald', sans-serif;
  font-size: 0.8rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--persimmon);
}
.issue-title {
  margin: 0.5rem 0 0;
  font-size: 1.5rem;
  font-weight: 700;
  color: #fff;
}
.issue-blurb {
  margin: 0.75rem 0 0;
  color: var(--text-muted);
  line-height: 1.55;
}
.issue-more {
  display: inline-block;
  margin-top: 1rem;
  font-family: 'Oswald', sans-serif;
  font-size: 0.82rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--accent);
}

@media (max-width: 768px) {
  .nav-links { display: none !important; }
  .hamburger { display: block; color: #fff; cursor: pointer; font-size: 1.4rem; }
}
</style>
</head>
<body class="antialiased">
<!-- Navigation -->
<nav class="navbar sticky top-0 z-50 px-4 md:px-8 flex items-center justify-between">
  <a href="/" class="py-4 text-xl font-bold tracking-wide text-white md:text-2xl hover:no-underline">GREENVILLE <span class="text-[var(--accent)]">NATIVES</span></a>
  <div class="hamburger" onclick="document.getElementById('navLinks').classList.toggle('open')">&#9776;</div>
  <ul class="nav-links hidden items-center md:flex" id="navLinks">
    <li><a href="/">League Site</a></li>
    <li><a href="/writeups/" class="active">Write-ups</a></li>
  </ul>
</nav>

<!-- Header -->
<div class="border-b-4 border-[var(--accent)] bg-gradient-to-br from-[#005A2B] to-[#0B6836] px-4 py-16 text-center">
  <h1 class="text-4xl font-bold text-white md:text-6xl">WRITE-<span class="text-[var(--accent)]">UPS</span></h1>
  <p class="mt-2 text-lg text-[var(--text-muted)]">The weekly issue, one per week of the season</p>
</div>

<!-- Issues -->
<div class="container mx-auto max-w-4xl px-4 py-10 md:px-8">
  <h2 class="mb-6 border-l-4 border-[var(--accent)] pl-4 text-2xl font-bold text-white">2026 Season</h2>

  <div class="grid gap-5">
    <a class="issue-card" href="week1-2026-90s-cafeteria.html">
      <div class="issue-meta">2026 &middot; Week 1</div>
      <h3 class="issue-title">90s Cafeteria Food</h3>
      <p class="issue-blurb">Hardee opens with 170.2, the second highest score he's ever posted.</p>
      <span class="issue-more">Read the issue &rarr;</span>
    </a>
  </div>
</div>

<footer class="border-t border-[var(--border)] px-4 py-8 text-center text-sm text-[var(--persimmon)] md:px-8">
  <a href="/">&larr; Back to the league site</a>
</footer>
</body>
</html>
