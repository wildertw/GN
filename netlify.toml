[build]
  publish = "GN-site"

# Player headshots come from statmuse, which no longer serves them to the
# browser cross-site. Netlify fetches them server-side instead and serves
# them from our own origin, so no referrer, CORS or content-blocker rule
# applies. See toProxiedPhoto() in GN-site/index.html.
[[redirects]]
  from = "/statmuse/*"
  to = "https://cdn.statmuse.com/:splat"
  status = 200
  force = true

# A handful of headshots in players-list.csv are hosted by the NFL rather
# than statmuse. Same treatment, so those players get a real photo instead
# of an initials circle.
[[redirects]]
  from = "/nflcdn/*"
  to = "https://static.www.nfl.com/:splat"
  status = 200
  force = true

# Team D/ST logos in players-list.csv come from freebiesupply. Same
# treatment again, so a defense gets its team logo rather than initials.
[[redirects]]
  from = "/logocdn/*"
  to = "https://cdn.freebiesupply.com/:splat"
  status = 200
  force = true
